name: Audit

# Main-only: a newly disclosed advisory must not fail whichever unrelated PR
# happens to run CI first. The daily schedule catches advisories published
# while main is quiet.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  # Fails on any RustSec advisory (vulnerability, unmaintained, unsound, yanked)
  # affecting Cargo.lock.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

[package]
name        = "politeia"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
description = "kubeconfig parsing, mTLS TlsConnector construction, and a minimal hyper HTTP/1.1 API client with watch-streaming"
repository  = "https://github.com/litehop/politeia"
readme      = "README.md"
keywords    = ["kubernetes", "kubeconfig", "tls", "mtls", "rustls"]
categories  = ["api-bindings", "network-programming"]
exclude     = ["/temp", "/.claude", "/ai"]

[dependencies]
anyhow          = "1"
base64          = "0.23"
bytes           = "1"
http-body-util  = "0.1"
hyper           = { version = "1", features = ["http1", "client"] }
hyper-util      = { version = "0.1", features = ["tokio"] }
rustls                = "0.23"
rustls-post-quantum   = "0.2"
rustls-pemfile  = "2"
serde_json      = "1"
tokio           = { version = "1", features = ["net"] }
tokio-rustls    = "0.26"
tracing         = "0.1"

[dev-dependencies]
rcgen           = "0.14"
tokio           = { version = "1", features = ["full"] }
